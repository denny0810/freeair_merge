name: Auto Merge 

on:
  schedule:
    - cron: '0 16 * * *'     # 每天北京時間 0:00
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 迁出代码
        uses: actions/checkout@v4
      
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run script
        run: python merge.py
      - name: output
        run: ls -la output/
        
      #   推送到 gh-pages 分支,避免git push污染历史记录
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output     # 上传output文件夹
          publish_branch: gh-pages   # 推送到 gh-pages 分支
          force_orphan: true        # 每次只保留最新版本，保持乾淨
